name: publish doc

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-deploy:
    # only deploy on master push; PRs just build to verify
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/checkout@v4
      # pnpm 8 matches lockfileVersion 6.0; newer majors cannot read it
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - run: pnpm i --frozen-lockfile
      - name: Build
        run: pnpm run docs:build
      - name: GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target_branch: gh-pages
          build_dir: docs/.vuepress/dist
          jekyll: false

  build-pr:
    # build-only job for pull requests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - run: pnpm i --frozen-lockfile
      - name: Build
        run: pnpm run docs:build
