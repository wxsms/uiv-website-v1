name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/checkout@v7
      # pnpm 8 matches lockfileVersion 6.0; newer majors cannot read it
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - run: pnpm i --frozen-lockfile
      - name: Build
        run: pnpm run docs:build
        env:
          # vuepress 1.x (webpack 4) uses md4 hashes internally which are
          # unavailable in Node 17+ (OpenSSL 3)
          NODE_OPTIONS: --openssl-legacy-provider
